name: diary_app
description: "Где Дневник — школьное расписание и домашние задания в стиле VKUI."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.4.0
  flutter_svg: ^2.3.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  mobx: ^2.7.0
  provider: ^6.1.5+1
dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.12.0
  integration_test:
    sdk: flutter
  mobx_codegen: ^2.8.0

flutter:
  uses-material-design: true

  assets:
    - resource/icons/
    - resource/images/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: resource/launcher/icon.png
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: resource/launcher/foreground.png
  adaptive_icon_monochrome: resource/launcher/monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#000000"
    theme_color: "#2688EB"
